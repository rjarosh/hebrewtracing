<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#faf8f3">
<title>Hebrew Letter Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Hebrew:wght@400;600&display=swap" rel="stylesheet">
<style>
@font-face {
  font-family: "DanaYad";
  src: url("./DanaYadAlefAlefAlef-Normal.woff") format("woff");
  font-display: swap;
  font-weight: normal;
  font-style: normal;
}
:root {
  --ink:#30216f;
  --ink2:#5a42b5;
  --paper:#fffefa;
  --soft:#f1edff;
  --line:#ddd8e8;
  --guide:#d9d8df;
  --scriptFont:"DanaYad","Times New Roman",serif;
  --blockFont:"Noto Serif Hebrew","Frank Ruhl Libre","Times New Roman",serif;
  --letterFont:var(--scriptFont);
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; width:100%; height:100%; overflow:hidden; }
body {
  background:#faf8f3;
  color:#292536;
  font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
button { font:inherit; border:0; }
.app {
  width:100%; height:100%; max-width:700px; margin:auto;
  display:flex; flex-direction:column;
  padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom);
}
.app.block-mode { --letterFont:var(--blockFont); }
header {
  height:64px; flex:none; display:grid; grid-template-columns:48px 1fr auto;
  align-items:center; gap:8px; border-bottom:1px solid #e7e3dc;
}
.logo { font-size:21px; font-weight:650; letter-spacing:-.5px; text-align:center; }
.icon {
  width:48px;height:48px;border-radius:16px;background:transparent;
  font-size:27px;color:var(--ink); display:grid;place-items:center;
}
.modeSwitch { display:flex; background:var(--soft); border-radius:14px; padding:3px; gap:2px; }
.modeBtn {
  padding:8px 11px; border-radius:11px; background:transparent;
  color:var(--ink2); font-size:13px; font-weight:650;
}
.modeBtn.active { background:var(--ink); color:#fff; }
.modeBtn:active { transform:scale(.96); }
.screen { flex:1; min-height:0; display:none; flex-direction:column; }
.screen.active { display:flex; }
#menuScreen { overflow:auto; padding:22px 4px 24px; }
h1 { margin:8px 0 4px; font-size:31px; letter-spacing:-1px; }
.subtitle { margin:0 0 24px; color:#746e7d; font-size:16px; }
.letters {
  display:grid; grid-template-columns:repeat(4,1fr); gap:10px;
  direction:rtl;
}
.letterBtn {
  min-height:82px; border:1px solid var(--line); background:white;
  border-radius:19px; box-shadow:0 2px 7px #00000008;
  color:var(--ink); display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:3px;
}
.letterBtn:active { transform:scale(.96); background:var(--soft); }
.glyph { font-family:var(--letterFont); font-size:43px; line-height:1; }
.name { font-size:11px; color:#8a8491; direction:ltr; }
.practiceHead {
  display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
  padding:10px 0 8px;
}
.back { justify-self:start; color:var(--ink2); background:none; font-size:16px; padding:10px 5px; }
.current { text-align:center; }
.current .bigName { font-size:16px;color:var(--ink2); }
.current .bigLetter {
  font-family:var(--letterFont); font-size:66px;
  line-height:.8; color:var(--ink); display:block;
}
.clear { justify-self:end; padding:11px 15px; border:1px solid var(--line);
  border-radius:14px; background:white; color:var(--ink2); font-weight:600; }
.board {
  flex:1; min-height:0; position:relative; overflow:hidden;
  background:white; border:1.5px solid #d9d5d9; border-radius:24px;
  touch-action:none; box-shadow:0 3px 18px #00000007;
}
.guide {
  position:absolute; inset:0; display:grid; place-items:center;
  pointer-events:none;
}
.guideLetter {
  font-family:var(--letterFont);
  font-size:min(70vw,58vh,390px); color:var(--guide);
  line-height:1; user-select:none;
}
.hint {
  position:absolute; top:15px; left:0; right:0; text-align:center;
  color:#8b8790; font-size:14px; pointer-events:none;
}
canvas { position:absolute; inset:0; width:100%; height:100%; touch-action:none; }
.bottom {
  flex:none; display:grid; grid-template-columns:1fr 72px 1fr; gap:9px;
  padding:12px 0 10px; align-items:center;
}
.nav {
  height:58px; border-radius:18px; background:var(--soft);
  color:var(--ink); font-weight:650; font-size:16px;
}
.nav:active,.clear:active { transform:scale(.97); }
.home {
  width:68px;height:68px;border-radius:50%;background:white;
  border:1px solid var(--line);color:var(--ink);font-size:25px;
  display:grid;place-items:center;justify-self:center;
}
.home small { display:block;font-size:10px;margin-top:-7px; }
@media (min-width:600px) {
  .letters { grid-template-columns:repeat(6,1fr); }
}
</style>
</head>
<body>
<div class="app" id="app">
<header>
  <button class="icon" id="menuBtn" aria-label="Menu">☰</button>
  <div class="logo">Hebrew Letters</div>
  <div class="modeSwitch" id="modeSwitch">
    <button class="modeBtn active" data-mode="script">כתב</button>
    <button class="modeBtn" data-mode="block">דפוס</button>
  </div>
</header>

<section class="screen active" id="menuScreen">
  <h1>Choose a letter</h1>
  <p class="subtitle">Tap a letter to start practicing</p>
  <div class="letters" id="letters"></div>
</section>

<section class="screen" id="practiceScreen">
  <div class="practiceHead">
    <button class="back" id="chooseBtn">‹ Choose a letter</button>
    <div class="current">
      <span class="bigLetter" id="currentLetter"></span>
      <span class="bigName" id="currentName"></span>
    </div>
    <button class="clear" id="clearBtn">↻ Clear</button>
  </div>

  <div class="board" id="board">
    <div class="hint">Trace the letter with your finger</div>
    <div class="guide"><div class="guideLetter" id="guideLetter"></div></div>
    <canvas id="canvas"></canvas>
  </div>

  <div class="bottom">
      <button class="nav" id="nextBtn">← &nbsp; Next</button>
      <button class="home" id="homeBtn" aria-label="Menu">⌂<small>בית</small></button>
      <button class="nav" id="prevBtn">Previous &nbsp; →</button>
  </div>
</section>
</div>

<script>
const letters = [
 ["א","Alef"],["ב","Bet"],["ג","Gimel"],["ד","Dalet"],["ה","He"],["ו","Vav"],
 ["ז","Zayin"],["ח","Het"],["ט","Tet"],["י","Yod"],["כ","Kaf"],["ך","Final Kaf"],
 ["ל","Lamed"],["מ","Mem"],["ם","Final Mem"],["נ","Nun"],["ן","Final Nun"],
 ["ס","Samekh"],["ע","Ayin"],["פ","Pe"],["ף","Final Pe"],["צ","Tsadi"],
 ["ץ","Final Tsadi"],["ק","Qof"],["ר","Resh"],["ש","Shin"],["ת","Tav"]
];

let index = 0;
const appEl = document.getElementById("app");
const menuScreen = document.getElementById("menuScreen");
const practiceScreen = document.getElementById("practiceScreen");
const lettersEl = document.getElementById("letters");
const currentLetter = document.getElementById("currentLetter");
const currentName = document.getElementById("currentName");
const guideLetter = document.getElementById("guideLetter");
const canvas = document.getElementById("canvas");
const board = document.getElementById("board");
const ctx = canvas.getContext("2d");

function showMenu() {
  menuScreen.classList.add("active");
  practiceScreen.classList.remove("active");
}
function showPractice(i) {
  index = (i + letters.length) % letters.length;
  const [char,name] = letters[index];
  currentLetter.textContent = char;
  currentName.textContent = name;
  guideLetter.textContent = char;
  menuScreen.classList.remove("active");
  practiceScreen.classList.add("active");
  requestAnimationFrame(resizeCanvas);
}
letters.forEach(([char,name],i)=>{
  const b=document.createElement("button");
  b.className="letterBtn";
  b.innerHTML=`<span class="glyph">${char}</span><span class="name">${name}</span>`;
  b.onclick=()=>showPractice(i);
  lettersEl.appendChild(b);
});

// Script / block letter mode toggle
document.querySelectorAll(".modeBtn").forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll(".modeBtn").forEach(b=>b.classList.toggle("active", b===btn));
    appEl.classList.toggle("block-mode", btn.dataset.mode==="block");
  };
});

function resizeCanvas() {
  const r=board.getBoundingClientRect(), d=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.round(r.width*d); canvas.height=Math.round(r.height*d);
  canvas.style.width=r.width+"px"; canvas.style.height=r.height+"px";
  ctx.setTransform(d,0,0,d,0,0);
  ctx.lineCap="round"; ctx.lineJoin="round";
  ctx.strokeStyle="#4f31a5"; ctx.lineWidth=6;
}
window.addEventListener("resize", resizeCanvas);

let drawing=false;
function point(e) {
  const r=canvas.getBoundingClientRect();
  return {x:e.clientX-r.left,y:e.clientY-r.top};
}
canvas.addEventListener("pointerdown",e=>{
  drawing=true; canvas.setPointerCapture(e.pointerId);
  const p=point(e); ctx.beginPath(); ctx.moveTo(p.x,p.y);
});
canvas.addEventListener("pointermove",e=>{
  if(!drawing)return;
  const p=point(e); ctx.lineTo(p.x,p.y); ctx.stroke();
});
canvas.addEventListener("pointerup",()=>drawing=false);
canvas.addEventListener("pointercancel",()=>drawing=false);

document.getElementById("clearBtn").onclick=()=>ctx.clearRect(0,0,canvas.width,canvas.height);
document.getElementById("nextBtn").onclick=()=>showPractice(index+1);
document.getElementById("prevBtn").onclick=()=>showPractice(index-1);
document.getElementById("chooseBtn").onclick=showMenu;
document.getElementById("homeBtn").onclick=showMenu;
document.getElementById("menuBtn").onclick=()=>practiceScreen.classList.contains("active")?showMenu():showMenu();
</script>
</body>
</html>
